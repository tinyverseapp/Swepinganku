<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <!-- Deep Navy Gradient -->
    <linearGradient id="swpNavyH" x1="12" y1="26" x2="38" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Surgical Teal to Cyan Gradient -->
    <linearGradient id="swpTealH" x1="26" y1="8" x2="54" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="40%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Surgical Cyan Accent -->
    <linearGradient id="swpAccentH" x1="41" y1="13" x2="49" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- ================= SYMBOL ================= -->
  <g transform="translate(4, 0)">
    <!-- Shape B: Navy Arm (Left & Bottom) -->
    <path
      d="M24 26H14C10.6863 26 8 28.6863 8 32C8 35.3137 10.6863 38 14 38H26V50C26 53.3137 28.6863 56 32 56C35.3137 56 38 53.3137 38 50V40L24 26Z"
      fill="url(#swpNavyH)"
    />

    <!-- Data Grooves on Navy Arm -->
    <rect x="13" y="29.5" width="7.5" height="2" rx="1" fill="#38BDF8" fill-opacity="0.9" />
    <rect x="13" y="33" width="5" height="1.8" rx="0.9" fill="#94A3B8" fill-opacity="0.75" />

    <!-- Shape A: Teal Arm (Top & Right) -->
    <path
      d="M26 24V14C26 10.6863 28.6863 8 32 8C35.3137 8 38 10.6863 38 14V26H50C53.3137 26 56 28.6863 56 32C56 35.3137 53.3137 38 50 38H40L26 24Z"
      fill="url(#swpTealH)"
    />

    <!-- Patient Silhouette Head & Telemetry Node -->
    <circle cx="46" cy="18" r="7.5" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="46" cy="18" r="4.5" fill="url(#swpAccentH)" />
    <circle cx="44.5" cy="16.5" r="1.3" fill="#FFFFFF" fill-opacity="0.85" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <g transform="translate(76, 0)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <tspan font-size="27" font-weight="800" fill="#0F172A" letter-spacing="-0.035em">Sweping</tspan>
      <tspan font-size="27" font-weight="700" fill="#0D9488" letter-spacing="-0.035em">anku</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="0.16em">
      SURGICAL PATIENT MONITORING
    </text>
  </g>
</svg>
