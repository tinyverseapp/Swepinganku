name: One-shot TypeScript Fix 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix unknown string type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/DocumentSweepingView.tsx')
          s = p.read_text()
          s = s.replace('r.toLowerCase()', 'String(r).toLowerCase()')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify TypeScript
        run: npm run lint

      - name: Verify production build
        run: npm run build

      - name: Commit fixes and remove one-shot workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/DocumentSweepingView.tsx .github/workflows/fix-ts-errors-2.yml
          git commit -m 'fix: resolve remaining TypeScript error' || true
          git push
