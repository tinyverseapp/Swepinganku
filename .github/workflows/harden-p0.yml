name: harden-p0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P0 hardening patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'Patch target not found in {path}: {old[:120]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('src/components/PatientModal.tsx', [
              ("const [jk, setJk] = useState<'L' | 'P'>('L');", "const [jk, setJk] = useState<'L' | 'P' | ''>('');"),
              ("setJk(initialData.jk || 'L');", "setJk(initialData.jk || '');"),
              ("setJk('L');", "setJk('');"),
          ])

          patch('src/data/constants.ts', [
              ("export function getPatientHonorific(ageStr?: string, jk?: 'L'|'P'|string): 'An.'|'Tn.'|'Ny.' { const ageYears=parseAgeInYears(ageStr); if(ageYears!==null) return ageYears<18?'An.':jk==='P'?'Ny.':'Tn.'; return jk==='P'?'Ny.':'Tn.'; }", "export function getPatientHonorific(ageStr?: string, jk?: 'L'|'P'|string): 'An.'|'Tn.'|'Ny.'|'' { const ageYears=parseAgeInYears(ageStr); if(ageYears!==null && ageYears<18) return 'An.'; if(jk==='P') return 'Ny.'; if(jk==='L') return 'Tn.'; return ''; }"),
              ("if(!cleanName) return `${prefix} ${trimmed}`; return `${prefix} ${cleanName}`;", "if(!cleanName) return prefix ? `${prefix} ${trimmed}` : trimmed; return prefix ? `${prefix} ${cleanName}` : cleanName;"),
          ])

          patch('src/lib/firestoreService.ts', [
              ("function makeDocId(patient: Patient & { teamCode?: string; date?: string }): string {\n  const safe = (s: string) => String(s || '').replace(/[^a-zA-Z0-9_\\-.:]/g, '_').substring(0, 40);\n  return `${safe(patient.teamCode || 'NOTEAM')}_${safe(patient.date)}_${safe(patient.rm || patient.id)}`;\n}", "function makeDocId(patient: Patient & { teamCode?: string; date?: string }): string {\n  const safe = (s: string) => String(s || '').replace(/[^a-zA-Z0-9_\\-.:]/g, '_').substring(0, 40);\n  // Patient ID is immutable; RM is mutable clinical data and must never be the document identity.\n  return `${safe(patient.teamCode || 'NOTEAM')}_${safe(patient.date)}_${safe(patient.id)}`;\n}\n\nfunction makeLegacyDocId(patient: Patient & { teamCode?: string; date?: string }): string {\n  const safe = (s: string) => String(s || '').replace(/[^a-zA-Z0-9_\\-.:]/g, '_').substring(0, 40);\n  return `${safe(patient.teamCode || 'NOTEAM')}_${safe(patient.date)}_${safe(patient.rm || patient.id)}`;\n}"),
              ("async function recordWeeklyHistory(patient: Patient, teamCode: string, date: string): Promise<void> {\n  if (!teamCode || !date || !patient.rm) return;\n  const payload = historyPayload(patient, teamCode, date);\n  const ref = doc(db, COLLECTION, weeklyDocId(teamCode, payload.weekStart, patient.rm));\n  await setDoc(ref, payload, { merge: true });\n}", "async function recordWeeklyHistory(patient: Patient, teamCode: string, date: string): Promise<void> {\n  if (!teamCode || !date || !patient.rm) return;\n  const payload = historyPayload(patient, teamCode, date);\n  const ref = doc(db, COLLECTION, weeklyDocId(teamCode, payload.weekStart, patient.rm));\n  const { days: _days, ...summary } = payload;\n  await setDoc(ref, { ...summary, [`days.${date}`]: { patient: { ...patient, teamCode, date }, recordedAt: summary.updatedAt } }, { merge: true });\n}"),
              ("    existing.docs.forEach((d) => {\n      const data = d.data() as FirestorePatientRecord;\n      if (!isWeeklyHistory(data)) batch.delete(d.ref);\n    });", "    const desiredIds = new Set(patients.map((p) => makeDocId({ ...p, teamCode, date })));\n    existing.docs.forEach((d) => {\n      const data = d.data() as FirestorePatientRecord;\n      if (isWeeklyHistory(data)) return;\n      // Delete only stale records for this team/date; do not replace another user's concurrent patients.\n      const samePatient = patients.some((p) => (p.id && data.id === p.id) || (p.rm && data.rm && p.rm.trim().toLowerCase() === data.rm.trim().toLowerCase()));\n      if (samePatient && !desiredIds.has(d.id)) batch.delete(d.ref);\n    });"),
              ("      batch.set(doc(db, COLLECTION, makeDocId(normalized)), normalized);", "      batch.set(doc(db, COLLECTION, makeDocId(normalized)), normalized);\n      const legacyId = makeLegacyDocId(normalized);\n      const stableId = makeDocId(normalized);\n      if (legacyId !== stableId) {\n        const legacyRef = doc(db, COLLECTION, legacyId);\n        batch.delete(legacyRef);\n      }"),
              ("  await setDoc(doc(db, COLLECTION, makeDocId(normalized)), normalized);\n  await recordWeeklyHistory(normalized, teamCode, date);", "  await setDoc(doc(db, COLLECTION, makeDocId(normalized)), normalized);\n  const legacyId = makeLegacyDocId(normalized);\n  const stableId = makeDocId(normalized);\n  if (legacyId !== stableId) await deleteDoc(doc(db, COLLECTION, legacyId));\n  await recordWeeklyHistory(normalized, teamCode, date);"),
              ("  batch.delete(doc(db, COLLECTION, makeDocId({ ...patient, teamCode, date: fromDate })));", "  batch.delete(doc(db, COLLECTION, makeDocId({ ...patient, teamCode, date: fromDate })));\n  const legacyFromId = makeLegacyDocId({ ...patient, teamCode, date: fromDate });\n  const stableFromId = makeDocId({ ...patient, teamCode, date: fromDate });\n  if (legacyFromId !== stableFromId) batch.delete(doc(db, COLLECTION, legacyFromId));"),
          ])

          rules = Path('firestore.rules')
          s = rules.read_text()
          s = s.replace("&& (data.jk == 'L' || data.jk == 'P')", "&& (data.jk == 'L' || data.jk == 'P' || data.jk == '')")
          s = s.replace("&& (!('updatedAt' in data) || (data.updatedAt is string && data.updatedAt.size() <= 50));", "&& (!('updatedAt' in data) || (data.updatedAt is string && data.updatedAt.size() <= 50))\n        && (!('doctorRole' in data) || data.doctorRole == 'DPJP' || data.doctorRole == 'RABER' || data.doctorRole == 'KONSUL')\n        && (!('supervisingDpjp' in data) || (data.supervisingDpjp is string && data.supervisingDpjp.size() <= 200));")
          old = "    match /sweepinganku/{patientId} {\n      allow read: if request.auth != null;\n      allow create: if request.auth != null && isValidId(patientId) && isValidSweepingPatient(request.resource.data);\n      allow update: if request.auth != null && isValidId(patientId) && isValidSweepingPatient(request.resource.data);\n      allow delete: if request.auth != null && isValidId(patientId);\n    }"
          new = "    function isAdmin() {\n      return request.auth != null && request.auth.token.email == 'm.hafidzuddin.s@gmail.com';\n    }\n\n    function isTeamMember(teamCode) {\n      return request.auth != null && exists(/databases/$(database)/documents/teamMembers/$(teamCode)/members/$(request.auth.uid));\n    }\n\n    match /sweepinganku/{patientId} {\n      allow read: if request.auth != null && (isTeamMember(resource.data.teamCode) || isAdmin());\n      allow create: if request.auth != null && isValidId(patientId) && isValidSweepingPatient(request.resource.data) && (isTeamMember(request.resource.data.teamCode) || isAdmin());\n      allow update: if request.auth != null && isValidId(patientId) && isValidSweepingPatient(request.resource.data) && (isTeamMember(request.resource.data.teamCode) || isAdmin());\n      allow delete: if request.auth != null && isValidId(patientId) && (isTeamMember(resource.data.teamCode) || isAdmin());\n    }"
          if old not in s: raise SystemExit('sweepinganku rules target not found')
          s = s.replace(old, new, 1)
          old = "    match /sweepingankuWeekly/{historyId} {\n      allow read: if request.auth != null;\n      allow create, update: if request.auth != null && isValidId(historyId);\n      allow delete: if false;\n    }"
          new = "    match /sweepingankuWeekly/{historyId} {\n      allow read, write: if false;\n    }"
          if old in s: s = s.replace(old, new, 1)
          # Keep all team patient history in the same protected collection.
          rules.write_text(s)

          # Remove this one-shot workflow after the patch is committed.
          Path('.github/workflows/harden-p0.yml').unlink()
          PY
      - name: Commit P0 hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PatientModal.tsx src/data/constants.ts src/lib/firestoreService.ts firestore.rules .github/workflows/harden-p0.yml
          git commit -m "fix: harden P0 data security and integrity"
          git push
