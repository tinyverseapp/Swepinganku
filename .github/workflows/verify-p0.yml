name: verify-p0
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply division doctor classification migration
        run: python3 scripts/fix-division-doctors.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit migrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/AiImportModal.tsx scripts/fix-division-doctors.py
          git diff --cached --quiet || (git commit -m 'fix: classify patients by active division doctors' && git push)
