name: apply-wa-format-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WA and document formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/utils/storage.ts')
          s = p.read_text()
          old1 = "return `${i + 1}. ${bedOrKamar} / ${formattedName} / ${p.jk || '-'} / ${p.age || '-'} / ${p.rm} / ${p.dx || '-'}${mode === 'all' ? ' / DPJP: ' + p.dpjp : ''}`;"
          new1 = "const roleLines = p.doctorRole === 'RABER' ? `\\nDPJP: ${p.supervisingDpjp || p.dpjp}\\nRaber: ${p.dpjp}` : p.doctorRole === 'KONSUL' ? `\\nDPJP: ${p.supervisingDpjp || p.dpjp}\\nKonsul: ${p.dpjp}` : `\\nDPJP: ${p.dpjp}`; return `${i + 1}. ${bedOrKamar} / ${formattedName} / ${p.jk || '-'} / ${p.age || '-'} / ${p.rm} / ${p.dx || '-'}${roleLines}`;"
          if old1 not in s:
              raise SystemExit('storage target 1 not found')
          s = s.replace(old1, new1, 1)
          old2 = "return `${i + 1}. ${bedOrKamar} / ${formattedName} / ${p.jk || '-'} / ${p.age || '-'} / ${p.rm} / ${p.dx || '-'}${withDpjp ? ' / DPJP: ' + p.dpjp : ''}`;"
          new2 = "const roleLines = p.doctorRole === 'RABER' ? `\\nDPJP: ${p.supervisingDpjp || p.dpjp}\\nRaber: ${p.dpjp}` : p.doctorRole === 'KONSUL' ? `\\nDPJP: ${p.supervisingDpjp || p.dpjp}\\nKonsul: ${p.dpjp}` : `\\nDPJP: ${p.dpjp}`; return `${i + 1}. ${bedOrKamar} / ${formattedName} / ${p.jk || '-'} / ${p.age || '-'} / ${p.rm} / ${p.dx || '-'}${roleLines}`;"
          if old2 not in s:
              raise SystemExit('storage target 2 not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          p = Path('src/components/DocumentSweepingView.tsx')
          s = p.read_text()
          old = "return <li key={patient.id} className=\"group p-2 -mx-2 rounded-lg hover:bg-blue-50/60 transition-colors flex items-start justify-between gap-3 text-slate-800\"><div className=\"flex-1 leading-relaxed\"><span className=\"font-semibold text-slate-900 mr-2\">{idx + 1}.</span><span className=\"font-medium text-slate-900\">{bedOrKamar}</span><span className=\"text-slate-400 mx-1.5\">/</span><span className=\"font-bold text-slate-900\">{formattedName}</span><span className=\"text-slate-400 mx-1.5\">/</span><span>{patient.jk}</span><span className=\"text-slate-400 mx-1.5\">/</span><span>{patient.age}</span><span className=\"text-slate-400 mx-1.5\">/</span><span className=\"font-mono text-xs text-slate-700 font-semibold\">{patient.rm}</span><span className=\"text-slate-400 mx-1.5\">/</span><span className=\"text-slate-800\">{patient.dx}</span><span className=\"text-blue-700 font-medium ml-2\">[{roleLabel}: {patient.dpjp}]</span></div>"
          new = "const roleLine = patient.doctorRole === 'RABER' ? <><div className=\"text-blue-700 font-medium\">DPJP: {patient.supervisingDpjp || patient.dpjp}</div><div className=\"text-amber-700 font-medium\">Raber: {patient.dpjp}</div></> : patient.doctorRole === 'KONSUL' ? <><div className=\"text-blue-700 font-medium\">DPJP: {patient.supervisingDpjp || patient.dpjp}</div><div className=\"text-violet-700 font-medium\">Konsul: {patient.dpjp}</div></> : <div className=\"text-blue-700 font-medium\">DPJP: {patient.dpjp}</div>; return <li key={patient.id} className=\"group p-2 -mx-2 rounded-lg hover:bg-blue-50/60 transition-colors flex items-start justify-between gap-3 text-slate-800\"><div className=\"flex-1 leading-snug\"><div><span className=\"font-semibold text-slate-900 mr-2\">{idx + 1}.</span><span className=\"font-medium text-slate-900\">{bedOrKamar}</span><span className=\"text-slate-400 mx-1.5\">/</span><span className=\"font-bold text-slate-900\">{formattedName}</span><span className=\"text-slate-400 mx-1.5\">/</span><span>{patient.jk}</span><span className=\"text-slate-400 mx-1.5\">/</span><span>{patient.age}</span><span className=\"text-slate-400 mx-1.5\">/</span><span className=\"font-mono text-xs text-slate-700 font-semibold\">{patient.rm}</span><span className=\"text-slate-400 mx-1.5\">/</span><span className=\"text-slate-800\">{patient.dx}</span></div>{roleLine}</div>"
          if old not in s:
              raise SystemExit('document target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patched files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-wa-format-fix.yml
          git add src/utils/storage.ts src/components/DocumentSweepingView.tsx .github/workflows/apply-wa-format-fix.yml
          git commit -m "fix: sync WA report with doctor roles"
          git push
