name: fix-ai-import-integrity
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: |
          if grep -q "function stripUndefined" src/lib/firestoreService.ts; then
            echo "Patch already applied; nothing to do."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          fs = Path('src/lib/firestoreService.ts')
          s = fs.read_text()
          anchor = "const WEEKLY_HISTORY_TYPE = 'weeklyHistory';\n"
          helper = '''\n// Firestore rejects `undefined` anywhere in a document. Optional patient\n// fields may be absent, so sanitize every write at the Firestore boundary.\nfunction stripUndefined<T>(value: T): T {\n  if (Array.isArray(value)) return value.map((item) => stripUndefined(item)) as T;\n  if (value && typeof value === 'object') {\n    const result: Record<string, unknown> = {};\n    Object.entries(value as Record<string, unknown>).forEach(([key, item]) => {\n      if (item !== undefined) result[key] = stripUndefined(item);\n    });\n    return result as T;\n  }\n  return value;\n}\n'''
          s = s.replace(anchor, anchor + helper, 1)
          s = s.replace("return {\n    ...patient,\n    teamCode,", "return stripUndefined({\n    ...patient,\n    teamCode,", 1)
          s = s.replace("    updatedAt: recordedAt,\n  };\n}\n\n/** Permanently", "    updatedAt: recordedAt,\n  });\n}\n\n/** Permanently", 1)
          s = s.replace("const normalized = { ...p, teamCode, date, updatedAt: recordedAt };\n      batch.set(doc(db, COLLECTION, makeDocId(normalized)), normalized);", "const normalized = stripUndefined({ ...p, teamCode, date, updatedAt: recordedAt });\n      batch.set(doc(db, COLLECTION, makeDocId(normalized)), normalized);", 1)
          s = s.replace("batch.set(historyRef, {\n          ...normalized,", "batch.set(historyRef, stripUndefined({\n          ...normalized,", 1)
          s = s.replace("        }, { merge: true });\n      }\n    });\n    await batch.commit();", "        }), { merge: true });\n      }\n    });\n    await batch.commit();", 1)
          s = s.replace("batch.set(ref, {\n        ...p,", "batch.set(ref, stripUndefined({\n        ...p,", 1)
          s = s.replace("        [`days.${date}`]: { patient: { ...p, teamCode, date }, recordedAt },\n      }, { merge: true });", "        [`days.${date}`]: { patient: { ...p, teamCode, date }, recordedAt },\n      }), { merge: true });", 1)

          old = """  const normalized = { ...patient, teamCode, date, updatedAt: new Date().toISOString() };\n  await setDoc(doc(db, COLLECTION, makeDocId(normalized)), normalized);\n  const legacyId = makeLegacyDocId(normalized);\n  const stableId = makeDocId(normalized);\n  if (legacyId !== stableId) await deleteDoc(doc(db, COLLECTION, legacyId));\n  await recordWeeklyHistory(normalized, teamCode, date);\n}\n"""
          new = """  const normalized = stripUndefined({ ...patient, teamCode, date, updatedAt: new Date().toISOString() });\n  await setDoc(doc(db, COLLECTION, makeDocId(normalized)), normalized);\n  const legacyId = makeLegacyDocId(normalized);\n  const stableId = makeDocId(normalized);\n  if (legacyId !== stableId) await deleteDoc(doc(db, COLLECTION, legacyId));\n  await recordWeeklyHistory(normalized, teamCode, date);\n}\n\n/** Atomically import a complete AI result; no partial patient imports. */\nexport async function upsertPatientsToFirestore(patients: Patient[], teamCode: string, date: string): Promise<void> {\n  if (!teamCode) throw new Error('Kode tim Firebase kosong.');\n  if (!patients.length) return;\n  const batch = writeBatch(db);\n  const recordedAt = new Date().toISOString();\n  const weekStart = getWeekStart(date);\n  const weekEnd = getWeekEnd(weekStart);\n  patients.forEach((patient) => {\n    const normalized = stripUndefined({ ...patient, teamCode, date, updatedAt: recordedAt });\n    batch.set(doc(db, COLLECTION, makeDocId(normalized)), normalized);\n    const legacyId = makeLegacyDocId(normalized);\n    const stableId = makeDocId(normalized);\n    if (legacyId !== stableId) batch.delete(doc(db, COLLECTION, legacyId));\n    if (normalized.rm) {\n      const historyRef = doc(db, COLLECTION, weeklyDocId(teamCode, weekStart, normalized.rm));\n      batch.set(historyRef, stripUndefined({\n        ...normalized,\n        recordType: WEEKLY_HISTORY_TYPE,\n        weekStart,\n        weekEnd,\n        firstDate: date,\n        lastDate: date,\n        updatedAt: recordedAt,\n        [`days.${date}`]: { patient: normalized, recordedAt },\n      }), { merge: true });\n    }\n  });\n  await batch.commit();\n}\n"""
          if old not in s:
              raise SystemExit('Expected upsert block not found')
          s = s.replace(old, new, 1)
          fs.write_text(s)

          app = Path('src/App.tsx')
          a = app.read_text()
          old_import = "subscribeToPatients, savePatientsBatch, deletePatientFromFirestore, upsertPatientToFirestore, movePatientToDateFirestore"
          new_import = "subscribeToPatients, savePatientsBatch, deletePatientFromFirestore, upsertPatientToFirestore, upsertPatientsToFirestore, movePatientToDateFirestore"
          if old_import not in a:
              raise SystemExit('Expected Firestore import list not found')
          a = a.replace(old_import, new_import, 1)
          old_call = "await Promise.all(importedPatients.map((patient) => upsertPatientToFirestore(patient, activeTeam.teamCode, date)));"
          if old_call not in a:
              raise SystemExit('Expected AI import call not found')
          a = a.replace(old_call, "await upsertPatientsToFirestore(importedPatients, activeTeam.teamCode, date);", 1)
          app.write_text(a)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/firestoreService.ts src/App.tsx
          git commit -m "fix: harden AI import integrity"
          git rm .github/workflows/fix-ai-import-integrity.yml
          git commit -m "chore: remove temporary AI import workflow"
          git push
